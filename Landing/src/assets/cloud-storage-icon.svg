<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DB8FF"/>
      <stop offset="100%" stop-color="#4A90F5"/>
    </linearGradient>

    <linearGradient id="boxFrontGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3AE73"/>
      <stop offset="100%" stop-color="#CB9258"/>
    </linearGradient>

    <linearGradient id="boxSideGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8702F"/>
      <stop offset="100%" stop-color="#94612A"/>
    </linearGradient>

    <linearGradient id="boxTopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C181"/>
      <stop offset="100%" stop-color="#D9A35F"/>
    </linearGradient>

    <linearGradient id="flapGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C988"/>
      <stop offset="100%" stop-color="#D9A35F"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A6E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft ground shadow under the box -->
  <ellipse cx="200" cy="345" rx="95" ry="14" fill="#1E3A6E" opacity="0.10"/>

  <!-- Cloud -->
  <g filter="url(#softShadow)">
    <path d="
      M 96 210
      C 60 210, 32 184, 32 150
      C 32 116, 60 90, 94 90
      C 100 56, 132 30, 172 30
      C 206 30, 234 48, 248 76
      C 256 72, 265 70, 275 70
      C 308 70, 335 95, 339 128
      C 368 134, 390 159, 390 190
      C 390 224, 362 252, 328 252
      L 128 252
      C 110 252, 96 233, 96 210
      Z"
      fill="url(#cloudGradient)"/>
  </g>

  <!-- Upload arrow from box into cloud -->
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <line x1="211" y1="225" x2="211" y2="160"/>
    <polyline points="182,189 211,160 240,189"/>
  </g>

  <!-- Carton box -->
  <g>
    <!-- side face (right) -->
    <path d="M 268 240 L 300 222 L 300 322 L 268 340 Z" fill="url(#boxSideGradient)"/>

    <!-- front face -->
    <path d="M 132 240 L 268 240 L 268 340 L 132 340 Z" fill="url(#boxFrontGradient)"/>

    <!-- top face -->
    <path d="M 132 240 L 166 222 L 300 222 L 268 240 Z" fill="url(#boxTopGradient)"/>

    <!-- open flaps -->
    <path d="M 132 240 L 166 222 L 200 222 L 174 246 Z" fill="url(#flapGradient)"/>
    <path d="M 268 240 L 300 222 L 264 222 L 238 246 Z" fill="url(#flapGradient)"/>

    <!-- tape -->
    <rect x="193" y="222" width="14" height="118" fill="#F4E3C1" opacity="0.9"/>
    <rect x="132" y="276" width="136" height="14" fill="#F4E3C1" opacity="0.65"/>

    <!-- subtle cardboard seams -->
    <line x1="132" y1="240" x2="268" y2="240" stroke="#A8702F" stroke-width="2" opacity="0.4"/>
    <line x1="166" y1="222" x2="166" y2="320" stroke="#A8702F" stroke-width="1.5" opacity="0.25"/>
    <line x1="234" y1="222" x2="234" y2="320" stroke="#A8702F" stroke-width="1.5" opacity="0.25"/>
  </g>
</svg>
