<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cute dancing cloud mascot</title>
<desc>Adorable fluffy cloud mascot with big eyes that dances and floats with blue sparkles</desc>
<defs>
<style>
@keyframes float {
  0%,100%{transform:translateY(0) rotate(0deg)}
  30%{transform:translateY(-20px) rotate(2deg)}
  65%{transform:translateY(-10px) rotate(-1.5deg)}
}
@keyframes shad {
  0%,100%{transform:scaleX(1);opacity:.15}
  30%{transform:scaleX(.55);opacity:.05}
  65%{transform:scaleX(.72);opacity:.09}
}
@keyframes armL {
  0%,100%{transform:rotate(0deg);transform-origin:214px 295px}
  25%{transform:rotate(-50deg);transform-origin:214px 295px}
  75%{transform:rotate(18deg);transform-origin:214px 295px}
}
@keyframes armR {
  0%,100%{transform:rotate(0deg);transform-origin:466px 295px}
  25%{transform:rotate(50deg);transform-origin:466px 295px}
  75%{transform:rotate(-18deg);transform-origin:466px 295px}
}
@keyframes blink {
  0%,88%,100%{transform:scaleY(1)}
  93%{transform:scaleY(0.05)}
}
@keyframes pupilMove {
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-4px,-3px)}
  50%{transform:translate(5px,2px)}
  75%{transform:translate(-3px,4px)}
}
@keyframes fadeFloat1 {
  0%,100%{opacity:0;transform:translate(0,0) scale(0)}
  20%,50%{opacity:1;transform:translate(-20px,-30px) scale(1)}
}
@keyframes fadeFloat2 {
  0%,45%,100%{opacity:0;transform:translate(0,0) scale(0)}
  65%,82%{opacity:.9;transform:translate(16px,-35px) scale(1)}
}
@keyframes fadeFloat3 {
  0%,65%,100%{opacity:0;transform:translate(0,0) scale(0)}
  10%,40%{opacity:.8;transform:translate(24px,-22px) scale(.85)}
}
@keyframes fadeFloat4 {
  0%,28%,100%{opacity:0;transform:translate(0,0) scale(0)}
  48%,70%{opacity:.85;transform:translate(-26px,-18px) scale(.9)}
}
@keyframes fadeFloat5 {
  0%,55%,100%{opacity:0;transform:translate(0,0) scale(0)}
  70%,88%{opacity:.7;transform:translate(10px,-28px) scale(.75)}
}
@keyframes fadeFloat6 {
  0%,10%,100%{opacity:0;transform:translate(0,0) scale(0)}
  30%,55%{opacity:.6;transform:translate(-12px,-24px) scale(.7)}
}
@keyframes star1 {
  0%,75%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  20%,55%{opacity:1;transform:scale(1) rotate(45deg)}
}
@keyframes star2 {
  0%,35%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  55%,78%{opacity:.9;transform:scale(1) rotate(-30deg)}
}
@keyframes star3 {
  0%,58%,100%{opacity:0;transform:scale(0)}
  8%,38%{opacity:.8;transform:scale(.9)}
}
@keyframes note1 {
  0%,62%,100%{opacity:0;transform:translateY(0)}
  12%,45%{opacity:1;transform:translateY(-38px)}
}
@keyframes note2 {
  0%,22%,100%{opacity:0;transform:translateY(0)}
  48%,72%{opacity:.9;transform:translateY(-32px)}
}
@keyframes blush {
  0%,100%{opacity:.45}
  50%{opacity:.7}
}
.all{animation:float 1.3s ease-in-out infinite}
.shadow{animation:shad 1.3s ease-in-out infinite;transform-origin:340px 435px}
.aL{animation:armL 1.3s ease-in-out infinite}
.aR{animation:armR 1.3s ease-in-out infinite}
.eL{animation:blink 3.5s ease-in-out infinite;transform-origin:300px 278px}
.eR{animation:blink 3.5s ease-in-out infinite .07s;transform-origin:380px 278px}
.pp{animation:pupilMove 2.8s ease-in-out infinite}
.f1{animation:fadeFloat1 2.6s ease-in-out infinite;transform-origin:145px 220px}
.f2{animation:fadeFloat2 2.6s ease-in-out infinite .55s;transform-origin:540px 205px}
.f3{animation:fadeFloat3 2.6s ease-in-out infinite 1.1s;transform-origin:550px 335px}
.f4{animation:fadeFloat4 2.6s ease-in-out infinite .3s;transform-origin:138px 340px}
.f5{animation:fadeFloat5 2.6s ease-in-out infinite .8s;transform-origin:340px 130px}
.f6{animation:fadeFloat6 2.6s ease-in-out infinite 1.4s;transform-origin:200px 160px}
.s1{animation:star1 2.6s ease-in-out infinite .15s;transform-origin:152px 168px}
.s2{animation:star2 2.6s ease-in-out infinite .65s;transform-origin:534px 162px}
.s3{animation:star3 2.6s ease-in-out infinite 1.2s;transform-origin:530px 375px}
.n1{animation:note1 2.6s ease-in-out infinite;transform-origin:168px 255px}
.n2{animation:note2 2.6s ease-in-out infinite .9s;transform-origin:515px 248px}
.blush{animation:blush 2s ease-in-out infinite}
</style>
</defs>

<ellipse class="shadow" cx="340" cy="435" rx="100" ry="12" fill="#90c4e8" opacity=".15"/>

<g class="all">
  <g class="aL">
    <path d="M228 295 Q195 270 172 285 Q152 298 162 318 Q172 338 196 330 Q218 322 228 300 Z" fill="#d6eef9" stroke="#a8d4ef" stroke-width="2"/>
