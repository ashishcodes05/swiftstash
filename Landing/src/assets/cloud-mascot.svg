    <circle cx="510" cy="346" r="13" fill="#d6eef9" stroke="#a8d4ef" stroke-width="2"/>
  </g>
  <ellipse cx="340" cy="370" rx="148" ry="52" fill="#e8f6fd" stroke="#b8ddf5" stroke-width="2"/>
