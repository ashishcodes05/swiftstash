  <ellipse cx="510" cy="257" rx="7" ry="5" fill="#4da6de" transform="rotate(-15 510 257)"/>
  <line x1="515" y1="230" x2="527" y2="225" stroke="#4da6de" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="527" y1="242" x2="527" y2="218" stroke="#4da6de" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="522" cy="244" rx="7" ry="5" fill="#4da6de" transform="rotate(-15 522 244)"/>
</g>

</svg>
