  <circle cx="340" cy="248" r="88" fill="#e8f6fd" stroke="#b8ddf5" stroke-width="2"/>
  <circle cx="258" cy="218" r="48" fill="#e8f6fd" stroke="#b8ddf5" stroke-width="2"/>
  <circle cx="422" cy="218" r="48" fill="#e8f6fd" stroke="#b8ddf5" stroke-width="2"/>
  <ellipse cx="340" cy="310" rx="145" ry="95" fill="#e8f6fd"/>
  <ellipse cx="340" cy="360" rx="142" ry="46" fill="#e8f6fd"/>
  <rect x="220" y="310" width="240" height="80" fill="#e8f6fd"/>
  <ellipse class="blush" cx="265" cy="318" rx="30" ry="16" fill="#f8a4c0" opacity=".45"/>
  <ellipse class="blush" cx="415" cy="318" rx="30" ry="16" fill="#f8a4c0" opacity=".45"/>
  <g class="eL">
    <ellipse cx="300" cy="278" rx="30" ry="32" fill="white" stroke="#cce8f8" stroke-width="1.5"/>
  </g>
  <g class="eR">
    <ellipse cx="380" cy="278" rx="30" ry="32" fill="white" stroke="#cce8f8" stroke-width="1.5"/>
  </g>
  <g class="pp">
    <circle cx="304" cy="282" r="16" fill="#1a6fab"/>
    <circle cx="384" cy="282" r="16" fill="#1a6fab"/>
    <circle cx="304" cy="282" r="10" fill="#1e85d4"/>
    <circle cx="384" cy="282" r="10" fill="#1e85d4"/>
    <circle cx="309" cy="275" r="6" fill="white"/>
    <circle cx="389" cy="275" r="6" fill="white"/>
    <circle cx="299" cy="285" r="3" fill="white" opacity=".7"/>
    <circle cx="379" cy="285" r="3" fill="white" opacity=".7"/>
  </g>
  <path d="M312 315 Q326 330 340 320 Q354 330 368 315" fill="none" stroke="#1a6fab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="290" cy="225" r="4" fill="white" opacity=".8"/>
  <circle cx="385" cy="200" r="3" fill="white" opacity=".6"/>
  <circle cx="330" cy="185" r="5" fill="white" opacity=".7"/>
</g>

<circle class="f1" cx="145" cy="220" r="9" fill="#4da6de" opacity="0"/>
<circle class="f2" cx="540" cy="205" r="11" fill="#2e8fc7" opacity="0"/>
<circle class="f3" cx="550" cy="335" r="8" fill="#6dbde8" opacity="0"/>
<circle class="f4" cx="138" cy="340" r="10" fill="#4da6de" opacity="0"/>
